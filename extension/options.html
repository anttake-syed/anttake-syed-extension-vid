<!DOCTYPE html>
<html>
<head>
  <title>AntCapture Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 48px 40px;
      min-height: 100vh;
    }
    h1 { color: #818cf8; font-size: 22px; margin-bottom: 32px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
    }
    .card h2 { font-size: 15px; color: #94a3b8; margin-bottom: 16px; text-transform: uppercase; letter-spacing: .05em; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .row label { font-size: 15px; color: #e2e8f0; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #334155;
      border-radius: 24px;
      cursor: pointer;
      transition: background .2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform .2s;
    }
    input:checked + .slider { background: #6366f1; }
    input:checked + .slider::before { transform: translateX(20px); }
    .url-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .url-table td { padding: 6px 0; font-size: 13px; }
    .url-table td:first-child { color: #64748b; width: 80px; }
    .url-table td:last-child { color: #a5b4fc; font-family: monospace; }
    #status { margin-top: 12px; font-size: 13px; color: #34d399; min-height: 18px; }
  </style>
</head>
<body>
  <h1>AntCapture Settings</h1>

  <div class="card">
    <h2>Storage Destination</h2>
    <div class="row" style="flex-direction: column; align-items: flex-start; gap: 12px;">
      <label for="storageModeSelect">Where should captures be saved?</label>
      <select id="storageModeSelect" style="width: 100%; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 12px; font-size: 14px; font-family: inherit; outline: none; cursor: pointer;">
        <option value="computer">📁 Save to Computer directly</option>
        <option value="cloud">☁️ AntCapture Web + Google Drive</option>
        <option value="localhost">💻 Local Web UI (Self-Hosted)</option>
      </select>
    </div>

    <table class="url-table">
      <tr>
        <td>Server</td>
        <td id="serverLabel"></td>
      </tr>
      <tr>
        <td>Web UI</td>
        <td id="webUiLabel"></td>
      </tr>
    </table>

    <div id="status"></div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
