<!doctype html>
<html lang="en" style="background:#020617;">
  <head>
    <meta charset="UTF-8" />
    <!-- Prevent white flash before CSS loads -->
    <style>
      html, body { background: #020617; margin: 0; }
      /* Hide root until React mounts + fonts are ready — prevents FOUC */
      #root { opacity: 0; transition: opacity 0.18s ease; }
      #root.app-ready { opacity: 1; }
      /* Force Outfit to block-render so no system font flashes through */
      body { font-family: 'Outfit', system-ui, sans-serif; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AntCapture - Premium screen recording and cloud sync dashboard" />
    <title>AntCapture – Cloud Media Dashboard</title>
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Outfit Font and Material Symbols — display=block prevents FOUC -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
