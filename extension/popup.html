<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AntCapture</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 style="margin: 0; font-size: 19px;">
        <span style="color: #f8fafc; font-weight: 700; letter-spacing: -0.02em;">Ant</span><span style="color: #94a3b8; font-weight: 500;">Capture</span>
      </h1>
      <button class="settings-btn" id="settingsBtn" title="Settings">
        <span class="material-symbols-rounded" style="font-size:20px;">settings</span>
      </button>
    </div>

    <div class="card">
      <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Cloud Sync Active</span>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn primary" id="recordBtn">
        <span class="btn-icon material-symbols-rounded">radio_button_checked</span>
        <span class="btn-text">Record Screen</span>
      </button>
      <button class="btn" id="screenshotBtn">
        <span class="btn-icon material-symbols-rounded">screenshot_monitor</span>
        <span class="btn-text">Screenshot</span>
      </button>
    </div>

    <!-- Auth Section -->
    <div id="authSection" style="margin-top: 12px;">
      <button class="btn" id="googleLoginBtn" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
        <!-- Google 'G' logo -->
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span class="btn-text">Sign in with Google</span>
      </button>

      <div id="profileContainer" class="card" style="display: none; padding: 12px; margin-top: 0; align-items: center; gap: 12px; flex-direction: column; cursor: default;">
        <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
          <img id="userAvatar" src="" style="width: 32px; height: 32px; border-radius: 50%; background: #1e293b; border: 1px solid rgba(255,255,255,0.1);" />
          <div style="flex: 1; overflow: hidden;">
            <div id="userName" style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User Name</div>
            <div id="userEmail" style="font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">user@example.com</div>
          </div>
          <button id="logoutBtn" style="background: none; border: none; color: #f87171; cursor: pointer; padding: 4px; display:flex; align-items:center;" title="Sign Out">
            <span class="material-symbols-rounded" style="font-size:20px;">logout</span>
          </button>
        </div>
        <!-- Open Dashboard button — auto-logs into Web UI -->
        <button id="openDashboardBtn" style="width: 100%; background: linear-gradient(135deg,#6366f1,#a855f7); border: none; color: white; padding: 9px 14px; cursor: pointer; font-size: 13px; font-weight: 600; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <span class="material-symbols-rounded" style="font-size:18px;">open_in_new</span> Open Dashboard
        </button>
      </div>
    </div>

    <div class="footer">
      <div id="captureCountBadge">Captures: 0</div>
      <span>v1.0.0</span>
      <span id="storageInfo">Checking...</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
